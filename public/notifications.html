<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Notifications — Olvra Boost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F7FE; --surface:#FFFFFF; --surface-2:#EEF3FF; --blue:#2C5CF6; --blue-deep:#1339B0;
    --text:#10162B; --muted:#6B7590; --muted-2:#9AA3C0; --line:rgba(16,22,54,0.08);
    --shadow:0 6px 22px rgba(23,43,133,0.08); --red:#E5484D; --green:#12B76A;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; }
  body{ max-width:460px; margin:0 auto; min-height:100vh; padding-bottom:36px; }
  .header{ display:flex; align-items:center; gap:12px; padding:20px 16px 14px; position:sticky; top:0; background:var(--bg); z-index:5; }
  .back-btn{ width:38px; height:38px; border-radius:12px; background:#fff; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; text-decoration:none; color:var(--text); font-size:18px; box-shadow:var(--shadow); }
  .header h1{ font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:700; flex:1; }
  .mark-all{ font-size:12px; font-weight:600; color:var(--blue); background:none; border:none; cursor:pointer; }
  .list{ padding:4px 16px; display:flex; flex-direction:column; gap:10px; }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
  .card{
    background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px; box-shadow:var(--shadow);
    display:flex; gap:12px; cursor:pointer; animation:fadeUp 0.35s ease-out both; position:relative;
  }
  .card.unread{ border-color:rgba(44,92,246,0.3); background:linear-gradient(145deg,#F5F8FF,#fff); }
  .card.unread::before{ content:""; position:absolute; top:14px; left:6px; width:7px; height:7px; border-radius:50%; background:var(--blue); }
  .ic{ width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; }
  .ic.order{ background:#EEF3FF; } .ic.wallet{ background:#E7F9F1; }
  .body{ min-width:0; flex:1; }
  .title{ font-size:13.5px; font-weight:700; }
  .desc{ font-size:12.5px; color:var(--muted); margin-top:2px; line-height:1.45; }
  .time{ font-size:11px; color:var(--muted-2); margin-top:6px; }
  .empty-state{ text-align:center; padding:70px 24px; color:var(--muted-2); font-size:13px; }
  .empty-state .big{ font-size:36px; margin-bottom:12px; }
</style>
</head>
<body>

  <div class="header">
    <a href="/" class="back-btn">←</a>
    <h1>Notifications</h1>
    <button class="mark-all" id="mark-all-btn">Mark all read</button>
  </div>

  <div class="list" id="notif-list">
    <div class="empty-state">Loading…</div>
  </div>

  <script type="module">
    import { collection, query, orderBy, limit, getDocs, doc, updateDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { db, requireSignedInUser } from "./js/firebase-client.js";

    let uid = null;

    function timeAgo(ts) {
      if (!ts || !ts.toDate) return "";
      const mins = Math.floor((Date.now() - ts.toDate().getTime()) / 60000);
      if (mins < 1) return "just now";
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h ago`;
      return `${Math.floor(hrs / 24)}d ago`;
    }

    function iconFor(type) {
      return type === "wallet_funded" ? { cls: "wallet", icon: "💳" } : { cls: "order", icon: "🧾" };
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    async function loadNotifications() {
      const container = document.getElementById("notif-list");
      try {
        const q = query(collection(db, "users", uid, "notifications"), orderBy("created_at", "desc"), limit(50));
        const snap = await getDocs(q);
        if (snap.empty) {
          container.innerHTML = `<div class="empty-state"><div class="big">🔔</div>No notifications yet — order and wallet updates will show up here.</div>`;
          return;
        }
        container.innerHTML = snap.docs.map((d, i) => {
          const n = d.data();
          const { cls, icon } = iconFor(n.type);
          return `
            <div class="card ${n.read ? "" : "unread"}" data-id="${d.id}" style="animation-delay:${i * 0.03}s">
              <div class="ic ${cls}">${icon}</div>
              <div class="body">
                <div class="title">${escapeHtml(n.title || "Update")}</div>
                <div class="desc">${escapeHtml(n.body || "")}</div>
                <div class="time">${timeAgo(n.created_at)}</div>
              </div>
            </div>`;
        }).join("");

        container.querySelectorAll(".card").forEach((card) => {
          card.onclick = async () => {
            if (!card.classList.contains("unread")) return;
            card.classList.remove("unread");
            try { await updateDoc(doc(db, "users", uid, "notifications", card.dataset.id), { read: true }); } catch {}
          };
        });
      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="empty-state">Couldn't load notifications — check your connection and try again.</div>`;
      }
    }

    document.getElementById("mark-all-btn").onclick = async () => {
      const cards = document.querySelectorAll(".card.unread");
      if (!cards.length) return;
      try {
        const batch = writeBatch(db);
        cards.forEach((card) => {
          batch.update(doc(db, "users", uid, "notifications", card.dataset.id), { read: true });
          card.classList.remove("unread");
        });
        await batch.commit();
      } catch (err) { console.error(err); }
    };

    requireSignedInUser().then((user) => { uid = user.uid; loadNotifications(); });
  </script>
</body>
</html>

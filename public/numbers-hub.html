<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Numbers — Olvra Boost</title>
<script>
  (function(){
    try {
      var saved = localStorage.getItem("olvra_theme");
      if (saved === "dark" || saved === "light") document.documentElement.setAttribute("data-theme", saved);
    } catch {}
  })();
</script>
<style>
  * { box-sizing: border-box; }
  :root{
    --bg:#F4F7FE; --card:#fff; --text:#10162B; --muted:#6B7590; --muted-2:#9AA3C0;
    --line: rgba(16,22,54,0.08); --blue:#2C5CF6; --blue-deep:#1339B0; --shadow: 0 4px 14px rgba(23,43,133,0.06);
    --pending-bg:#FFF4E5; --pending-text:#FF9F43; --ok-bg:#E7F9F1; --ok-text:#12B76A;
    --fail-bg:#FDECEC; --fail-text:#E5484D; --dash-bg:#EEF3FF;
  }
  html[data-theme="dark"]{
    --bg:#0B0E1A; --card:#151A2E; --text:#F2F4FC; --muted:#9AA3C0; --muted-2:#6B7590;
    --line: rgba(242,244,252,0.09); --blue:#5B82FF; --blue-deep:#7FA0FF; --shadow: 0 4px 14px rgba(0,0,0,0.35);
    --pending-bg:#3A2E12; --pending-text:#FFB25E; --ok-bg:#123326; --ok-text:#3DD68C;
    --fail-bg:#3A1418; --fail-text:#FF6B70; --dash-bg:#1C2340;
  }
  @media (prefers-color-scheme: dark){
    html:not([data-theme="light"]):not([data-theme="dark"]){
      --bg:#0B0E1A; --card:#151A2E; --text:#F2F4FC; --muted:#9AA3C0; --muted-2:#6B7590;
      --line: rgba(242,244,252,0.09); --blue:#5B82FF; --blue-deep:#7FA0FF; --shadow: 0 4px 14px rgba(0,0,0,0.35);
      --pending-bg:#3A2E12; --pending-text:#FFB25E; --ok-bg:#123326; --ok-text:#3DD68C;
      --fail-bg:#3A1418; --fail-text:#FF6B70; --dash-bg:#1C2340;
    }
  }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg); margin: 0; padding: 0 0 90px; color: var(--text);
    max-width: 460px; margin-left: auto; margin-right: auto;
  }
  .header {
    display:flex; align-items:center; gap:12px; padding:18px 16px 14px;
    position:sticky; top:0; background:var(--bg); z-index:5;
  }
  .back-btn {
    width:38px; height:38px; border-radius:12px; background:var(--card); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; text-decoration:none; color:var(--text); font-size:18px;
  }
  .header h1 { font-size:17px; margin:0; font-weight:700; }
  .section-label { padding:14px 16px 6px; font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; }
  .number-list { padding: 0 16px; display:flex; flex-direction:column; gap:10px; }
  .number-card {
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px;
    box-shadow:var(--shadow);
  }
  .number-card .top-row { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .number-card .name { font-size:13.5px; font-weight:700; }
  .number-card .phone { font-size:12px; color:var(--muted); margin-top:2px; font-family:monospace; }
  .status { font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:8px; white-space:nowrap; text-transform:capitalize; }
  .status-processing { background:var(--pending-bg); color:var(--pending-text); }
  .status-completed { background:var(--ok-bg); color:var(--ok-text); }
  .status-failed { background:var(--fail-bg); color:var(--fail-text); }
  .code-box {
    margin-top:10px; background:var(--dash-bg); border-radius:12px; padding:10px 12px;
    display:flex; justify-content:space-between; align-items:center; gap:8px;
  }
  .code-box .code { font-family:monospace; font-weight:700; font-size:16px; color:var(--blue-deep); letter-spacing:0.03em; }
  .code-box .copy-btn {
    background:var(--card); border:none; border-radius:8px; padding:6px 10px; font-size:11.5px; font-weight:600;
    color:var(--blue-deep); flex-shrink:0;
  }
  .waiting-note { font-size:11.5px; color:var(--muted-2); margin-top:8px; }
  .empty-state { text-align:center; padding:50px 20px; color:var(--muted-2); font-size:13px; }

  .bottom-nav {
    position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:460px;
    background:var(--card); border-top:1px solid var(--line); display:flex; padding:10px 0 calc(10px + env(safe-area-inset-bottom));
    z-index:10;
  }
  .nav-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; background:none; border:none; font-size:10.5px; color:var(--muted-2); font-family:inherit; text-decoration:none; }
  .nav-item.active { color:var(--blue-deep); font-weight:700; }
  .nav-item .nav-ic { font-size:19px; }

  @keyframes cardIn{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:translateY(0); } }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; } }
  .number-card{ animation:cardIn 0.4s cubic-bezier(.2,.8,.2,1) both; transition:transform 0.12s ease; }
  .number-card:active{ transform:scale(0.98); }
  .back-btn{ transition:transform 0.12s ease; }
  .back-btn:active{ transform:scale(0.92); }
</style>
</head>
<body>

  <div class="header">
    <a href="/" class="back-btn">←</a>
    <h1>Your Numbers</h1>
  </div>

  <div class="section-label">Website OTP</div>
  <div class="number-list" id="otp-list">
    <div class="empty-state">Loading…</div>
  </div>

  <div class="section-label">Long-Term Numbers</div>
  <div class="number-list" id="hosting-list">
    <div class="empty-state">Loading…</div>
  </div>

  <div class="bottom-nav">
    <a href="/" class="nav-item"><span class="nav-ic">🏠</span>Home</a>
    <a href="/orders.html" class="nav-item"><span class="nav-ic">🧾</span>Orders</a>
    <a href="/numbers-hub.html" class="nav-item active"><span class="nav-ic">📱</span>Numbers</a>
    <a href="/#profile" class="nav-item"><span class="nav-ic">⚙️</span>Settings</a>
  </div>

  <script type="module">
    import { collection, query, where, limit, getDocs } from "./js/firebase-sdk.bundle.js";
    import { db, requireSignedInUser } from "./js/firebase-client.js";

    // No orderBy on purpose — a where()+orderBy() on different fields needs
    // a Firestore composite index, and number_orders/hosting_orders never
    // had one created, which is why this page showed "Couldn't load" for
    // everyone. Fetching by uid alone needs no composite index at all;
    // sorting the (small, per-user) result client-side gets the same
    // newest-first order without depending on any Firebase console setup.
    function sortByCreatedAtDesc(docs) {
      return [...docs].sort((a, b) => {
        const at = a.data().created_at?.toMillis ? a.data().created_at.toMillis() : 0;
        const bt = b.data().created_at?.toMillis ? b.data().created_at.toMillis() : 0;
        return bt - at;
      });
    }

    const CLOSED = new Set(["FINISHED", "CANCELED", "TIMEOUT", "BANNED"]);

    function statusClass(status) {
      if (status === "PENDING") return "status-processing";
      if (CLOSED.has(status) && status !== "FINISHED") return "status-failed";
      return "status-completed";
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function renderCard(o, kind) {
      const sms = o.sms || [];
      const latest = sms[sms.length - 1];
      const label = kind === "otp" ? `${o.product || ""} · ${o.country || ""}` : `${o.product || ""} · ${o.country || ""}`;
      return `
        <div class="number-card">
          <div class="top-row">
            <div>
              <div class="name">${escapeHtml(label)}</div>
              <div class="phone">${escapeHtml(o.phone || "")}</div>
            </div>
            <span class="status ${statusClass(o.status)}">${(o.status || "pending").toLowerCase()}</span>
          </div>
          ${latest ? `
            <div class="code-box">
              <span class="code">${escapeHtml(latest.code || latest.text || "")}</span>
              <button class="copy-btn" data-copy="${escapeHtml(latest.code || latest.text || "")}">Copy</button>
            </div>
          ` : `<div class="waiting-note">${CLOSED.has(o.status) ? "Closed — no code arrived." : "Waiting for a code…"}</div>`}
        </div>`;
    }

    async function loadNumbers(uid) {
      const otpContainer = document.getElementById("otp-list");
      const hostingContainer = document.getElementById("hosting-list");

      try {
        const otpQuery = query(collection(db, "number_orders"), where("uid", "==", uid), limit(50));
        const otpSnap = await getDocs(otpQuery);
        const otpDocs = sortByCreatedAtDesc(otpSnap.docs).slice(0, 15);
        otpContainer.innerHTML = otpDocs.length === 0
          ? `<div class="empty-state">No Website OTP numbers yet.</div>`
          : otpDocs.map((d) => renderCard(d.data(), "otp")).join("");
      } catch (err) {
        console.error(err);
        otpContainer.innerHTML = `<div class="empty-state">Couldn't load — check your connection.</div>`;
      }

      try {
        const hostingQuery = query(collection(db, "hosting_orders"), where("uid", "==", uid), limit(50));
        const hostingSnap = await getDocs(hostingQuery);
        const hostingDocs = sortByCreatedAtDesc(hostingSnap.docs).slice(0, 15);
        hostingContainer.innerHTML = hostingDocs.length === 0
          ? `<div class="empty-state">No Long-Term numbers yet.</div>`
          : hostingDocs.map((d) => renderCard(d.data(), "hosting")).join("");
      } catch (err) {
        console.error(err);
        hostingContainer.innerHTML = `<div class="empty-state">Couldn't load — check your connection.</div>`;
      }

      document.querySelectorAll("[data-copy]").forEach((btn) => {
        btn.onclick = () => {
          navigator.clipboard?.writeText(btn.dataset.copy);
          btn.textContent = "Copied!";
          setTimeout(() => { btn.textContent = "Copy"; }, 1200);
        };
      });
    }

    // Same cost-conscious polling pattern as orders.html — every 20s
    // while visible, stopped the instant the tab is hidden.
    let pollTimer = null;
    let currentUid = null;
    function startPolling(uid) {
      stopPolling();
      pollTimer = setInterval(() => loadNumbers(uid), 20000);
    }
    function stopPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = null;
    }
    document.addEventListener("visibilitychange", () => {
      if (!currentUid) return;
      if (document.hidden) stopPolling();
      else { loadNumbers(currentUid); startPolling(currentUid); }
    });

    requireSignedInUser().then((user) => {
      currentUid = user.uid;
      loadNumbers(currentUid);
      startPolling(currentUid);
    });
  </script>
</body>
</html>

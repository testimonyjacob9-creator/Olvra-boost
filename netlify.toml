[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# BigiSub's sync used to run every 6 hours; now once daily to reduce
# Firestore read cost from the diff-check comparison (2026-09-07).
[functions."sync-services"]
  schedule = "0 2 * * *"

# DISABLED (2026-09-09) — Testimony is now updating order status manually
# from admin.html's order Apply button instead of relying on this
# automated poll. Function code (sync-order-status.js /
# order-status-sync-core.js) is left in place in case automated syncing
# comes back later, but the cron trigger is off so it no longer reads
# Firestore or calls BigiSub on a timer.
# [functions."sync-order-status"]
#   schedule = "0 * * * *"

# DISABLED (2026-09-09) — this cron read the entire `users` collection
# every single day just to find who'd been inactive 2+ days (full
# collection scan, cost scales with total signups, not active users).
# Confirmed as the least essential read-burner: it's a marketing email,
# not core functionality. The function (reengage-users.js) is left in
# place for a manual/rewritten trigger later — see its file header for
# a note on switching to a `where("last_activity_at", "<", cutoff)`
# query instead of pulling everyone, if this gets revived.
# [functions."reengage-users"]
#   schedule = "0 9 * * *"

# The bundled Firebase SDK is the single largest download on every page
# (see scripts/bundle-firebase.js) but its content only changes on a new
# deploy — each filename stays the same across deploys, so a long
# immutable cache means a returning visitor re-downloads it 0 times
# instead of once per page navigation (this app does full page loads,
# not a single-page app, so without this header it re-fetches on every
# single page). Netlify's own asset hashing isn't in play here since the
# filename is fixed, so this header is what actually saves the repeat
# download.
[[headers]]
  for = "/js/firebase-sdk.bundle.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

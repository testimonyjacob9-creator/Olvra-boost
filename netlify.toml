[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Runs sync-services.js every 6 hours to refresh the BigiSub catalog.
[functions."sync-services"]
  schedule = "0 */6 * * *"

[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Runs sync-services.js every 6 hours to refresh the BigiSub catalog.
[functions."sync-services"]
  schedule = "0 */6 * * *"

# Owlet's catalog is far larger than BigiSub's — synced once a day
# instead of every 6 hours to keep it from eating the daily Firestore
# write quota (2026-09-03).
[functions."sync-services-owlet"]
  schedule = "0 3 * * *"

# Runs sync-order-status.js every 10 minutes to pull live order status
# from BigiSub/Owlet for orders that are still in-flight, so users see
# "completed" automatically instead of only when an admin manually edits
# the order. Checks at most 25 orders per run (oldest-first) to keep
# Firestore reads and provider API calls bounded even during a busy
# period.
#
# 2026-09-04: was every 10 minutes before — that's 144 runs/day × up to 25
# reads = up to 3,600 reads/day as a GUARANTEED baseline whether or not
# anything actually changed, a meaningful chunk of a Spark-plan daily
# quota on its own. 15 minutes = 96 runs/day × 25 = up to 2,400/day, still
# well within "not stuck on pending" territory (worst case ~15 min delay
# vs ~10 min before).
[functions."sync-order-status"]
  schedule = "*/15 * * * *"

# The bundled Firebase SDK is the single largest download on every page
# (see scripts/bundle-firebase.js) but its content only changes on a new
# deploy — each filename stays the same across deploys, so a long
# immutable cache means a returning visitor re-downloads it 0 times
# instead of once per page navigation (this app does full page loads,
# not a single-page app, so without this header it re-fetches on every
# single page). Netlify's own asset hashing isn't in play here since the
# filename is fixed, so this header is what actually saves the repeat
# download.
[[headers]]
  for = "/js/firebase-sdk.bundle.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

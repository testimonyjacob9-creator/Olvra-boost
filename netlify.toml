[build]
  command = "node scripts/generate-config.js"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Runs syncServices every 6 hours — replaces the old Firebase onSchedule trigger.
[functions."sync-services"]
  schedule = "0 */6 * * *"
  [[plugins]]
package = "@netlify/plugin-functions-install-core"

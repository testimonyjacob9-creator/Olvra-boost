[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# BigiSub's sync used to run every 6 hours; now once daily to reduce
# Firestore read cost from the diff-check comparison (2026-09-07).
[functions."sync-services"]
  schedule = "0 2 * * *"

# Runs sync-order-status.js every 15 minutes to pull live order status
# from BigiSub for orders that are still in-flight, so users see
# "completed" automatically instead of only when an admin manually edits
# the order. Checks at most 25 orders per run (oldest-first) to keep
# Firestore reads and BigiSub API calls bounded even during a busy
# period.
[functions."sync-order-status"]
  schedule = "*/15 * * * *"

# Runs daily — checks for users inactive 2+ days and sends the Olives
# re-engagement email (gated per-user internally so any one person is
# still only messaged about once every 2 days, not once every day this
# cron fires). See reengage-users.js for why a daily cron + in-function
# gating is used instead of trying to express "every 2 days" directly in
# cron syntax — same pattern WoodPayVTU already uses successfully.
[functions."reengage-users"]
  schedule = "0 9 * * *"

# The bundled Firebase SDK is the single largest download on every page
# (see scripts/bundle-firebase.js) but its content only changes on a new
# deploy — each filename stays the same across deploys, so a long
# immutable cache means a returning visitor re-downloads it 0 times
# instead of once per page navigation (this app does full page loads,
# not a single-page app, so without this header it re-fetches on every
# single page). Netlify's own asset hashing isn't in play here since the
# filename is fixed, so this header is what actually saves the repeat
# download.
[[headers]]
  for = "/js/firebase-sdk.bundle.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"
